<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verify email — Orecube</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex flex-col">

<main class="max-w-md mx-auto px-6 pt-24 text-center">
  <p class="text-sm mb-4">Orecube Platform</p>
  <h1 class="text-3xl font-semibold mb-4">Check your inbox</h1>

  <p class="text-gray-400 mb-8">
    We sent a verification link to<br>
    <span id="emailText" class="text-white font-medium"></span>
  </p>

  <button
    onclick="location.reload()"
    class="w-full py-3 rounded-full bg-white text-black hover:bg-gray-200">
    Continue
  </button>

  <p class="mt-6 text-blue-400 cursor-pointer" onclick="resend()">
    Resend email
  </p>
</main>

<footer class="text-center text-xs text-gray-500 pb-8 mt-auto">
  Terms of Use | Privacy Policy
</footer>

<script type="module">
  import { auth } from "/firebase-config.js";
  import { sendEmailVerification } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

  const email = new URLSearchParams(window.location.search).get("email");
  document.getElementById("emailText").textContent = email;

  window.resend = async () => {
    if (auth.currentUser) {
      await sendEmailVerification(auth.currentUser);
      alert("Verification email sent again");
    }
  };
</script>

</body>
</html>
