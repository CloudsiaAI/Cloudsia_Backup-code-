<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset password — Orecube</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex flex-col">

<main class="max-w-md mx-auto px-6 pt-24 text-center">
  <p class="text-sm mb-4">Orecube Platform</p>
  <h1 class="text-3xl font-semibold mb-6">Reset your password</h1>

  <p class="text-gray-400 mb-10">
    A password reset link has been sent to your email.
  </p>

  <button
    onclick="window.location.href='/login.html'"
    class="w-full py-3 rounded-full bg-white text-black hover:bg-gray-200">
    Back to login
  </button>
</main>

<footer class="text-center text-xs text-gray-500 pb-8 mt-auto">
  Terms of Use | Privacy Policy
</footer>

</body>
</html>
