<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign in — Orecube</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen flex flex-col">

<main class="flex-1 max-w-md mx-auto px-6 pt-24 w-full">

  <p class="text-center text-sm font-medium mb-4">Orecube Platform</p>

  <h1 class="text-center text-3xl font-semibold mb-10">
    Welcome back
  </h1>

  <div class="relative mb-6">
    <label class="absolute -top-2 left-4 bg-black px-2 text-xs text-gray-400">
      Email address
    </label>
    <input
      id="email"
      type="email"
      class="w-full px-4 py-3 rounded-full bg-transparent border border-gray-500 focus:border-white outline-none"
    />
  </div>

  <p id="error" class="text-red-500 text-sm mb-4 hidden"></p>

  <button
    id="continueBtn"
    class="w-full py-3 rounded-full bg-white text-black font-medium hover:bg-gray-200">
    Continue
  </button>

  <p class="text-center text-sm text-gray-400 mt-6">
    Don’t have an account?
    <a href="/signup.html" class="text-blue-400 hover:underline">Sign up</a>
  </p>

</main>

<footer class="text-center text-xs text-gray-500 pb-8">
  <a href="#">Terms of Use</a> | <a href="#">Privacy Policy</a>
</footer>

<script>
  const emailInput = document.getElementById('email');
  const error = document.getElementById('error');

  document.getElementById('continueBtn').onclick = () => {
    if (!emailInput.value) {
      error.textContent = "Email is required";
      error.classList.remove("hidden");
      return;
    }
    sessionStorage.setItem("authEmail", emailInput.value);
    window.location.href = "/password.html";
  };
</script>

</body>
</html>
