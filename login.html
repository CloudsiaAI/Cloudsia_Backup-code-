<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Orecube</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script type="module" src="/firebase-config.js"></script>

  <style>
    /* Floating label input */
    .field {
      position: relative;
    }
    .field input {
      background: transparent;
      color: white;
    }
    .field label {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      background: black;
      padding: 0 6px;
      color: #9ca3af;
      font-size: 0.875rem;
      pointer-events: none;
      transition: all 0.2s ease;
    }
    .field input:focus + label,
    .field input:not(:placeholder-shown) + label {
      top: -8px;
      font-size: 0.75rem;
      color: white;
    }
  </style>
</head>

<body class="bg-black text-white min-h-screen flex flex-col">

  <!-- Main content -->
  <main class="flex-1 max-w-md mx-auto px-6 pt-24 w-full">

    <p class="text-center text-sm font-medium mb-4">
      Orecube Platform
    </p>

    <h1 id="pageTitle" class="text-center text-3xl font-semibold mb-10">
      Welcome back
    </h1>

    <!-- Email -->
    <div class="field mb-6">
      <input
        id="email"
        type="email"
        required
        placeholder=" "
        class="w-full px-4 py-3 rounded-full border border-gray-500 focus:outline-none focus:border-white"
      />
      <label>Email address</label>
    </div>

    <!-- Password -->
    <div class="field mb-6 hidden" id="passwordWrap">
      <input
        id="password"
        type="password"
        required
        placeholder=" "
        class="w-full px-4 py-3 rounded-full border border-gray-500 focus:outline-none focus:border-white"
      />
      <label>Password</label>
    </div>

    <!-- Continue -->
    <button
      id="continueBtn"
      class="w-full py-3 rounded-full bg-white text-black font-medium hover:bg-gray-200 transition"
    >
      Continue
    </button>

    <!-- Switch -->
    <p class="text-center text-sm text-gray-400 mt-4">
      <span id="switchText">Don’t have an account?</span>
      <button id="toggleMode" class="text-blue-400 hover:underline ml-1">
        Sign up
      </button>
    </p>

    <!-- Divider -->
    <div class="flex items-center my-10">
      <div class="flex-1 h-px bg-gray-700"></div>
      <span class="px-3 text-gray-400 text-xs">OR</span>
      <div class="flex-1 h-px bg-gray-700"></div>
    </div>

    <!-- OAuth -->
    <div class="space-y-3">
      <button id="googleSignIn"
        class="w-full flex items-center justify-center gap-3 py-3 rounded-full bg-white text-black hover:bg-gray-200 transition">
        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5">
        Continue with Google
      </button>

      <button id="microsoftSignIn"
        class="w-full flex items-center justify-center gap-3 py-3 rounded-full bg-white text-black hover:bg-gray-200 transition">
        <img src="https://www.svgrepo.com/show/452062/microsoft.svg" class="w-5 h-5">
        Continue with Microsoft
      </button>

      <button id="githubSignIn"
        class="w-full flex items-center justify-center gap-3 py-3 rounded-full bg-white text-black hover:bg-gray-200 transition">
        <img src="https://www.svgrepo.com/show/512317/github-142.svg" class="w-5 h-5">
        Continue with GitHub
      </button>
    </div>

  </main>

  <!-- Footer fixed to bottom -->
  <footer class="text-center text-xs text-gray-500 py-6">
    <a href="#" class="hover:underline">Terms of Use</a>
    <span class="mx-2">|</span>
    <a href="#" class="hover:underline">Privacy Policy</a>
  </footer>

  <!-- Auth Logic -->
  <script type="module">
    import { auth, googleProvider, githubProvider } from './firebase-config.js';
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup,
      OAuthProvider
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const passwordWrap = document.getElementById('passwordWrap');
    const continueBtn = document.getElementById('continueBtn');
    const toggleMode = document.getElementById('toggleMode');
    const pageTitle = document.getElementById('pageTitle');
    const switchText = document.getElementById('switchText');

    let isSignup = false;
    let step = 1;

    continueBtn.onclick = async () => {
      if (!email.value) return alert("Enter email");

      if (step === 1) {
        passwordWrap.classList.remove('hidden');
        step = 2;
        continueBtn.textContent = isSignup ? 'Create account' : 'Sign in';
        return;
      }

      try {
        if (isSignup) {
          await createUserWithEmailAndPassword(auth, email.value, password.value);
        } else {
          await signInWithEmailAndPassword(auth, email.value, password.value);
        }
        window.location.href = '/';
      } catch (e) {
        alert(e.message);
      }
    };

    toggleMode.onclick = () => {
      isSignup = !isSignup;
      pageTitle.textContent = isSignup ? 'Create an account' : 'Welcome back';
      switchText.textContent = isSignup ? 'Already have an account?' : 'Don’t have an account?';
      toggleMode.textContent = isSignup ? 'Log in' : 'Sign up';
      continueBtn.textContent = 'Continue';
      passwordWrap.classList.add('hidden');
      step = 1;
    };

    document.getElementById('googleSignIn').onclick = async () => {
      await signInWithPopup(auth, googleProvider);
      window.location.href = '/';
    };

    document.getElementById('githubSignIn').onclick = async () => {
      await signInWithPopup(auth, githubProvider);
      window.location.href = '/';
    };

    document.getElementById('microsoftSignIn').onclick = async () => {
      const provider = new OAuthProvider('microsoft.com');
      await signInWithPopup(auth, provider);
      window.location.href = '/';
    };
  </script>

</body>
</html>
