<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — Orecube</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Firebase config -->
  <script type="module" src="/firebase-config.js"></script>
</head>

<body class="bg-black min-h-screen flex items-center justify-center text-black">

  <div class="w-full max-w-sm px-6">
    
    <!-- Logo / Title -->
    <div class="text-center mb-8">
      <h1 class="text-white text-sm font-medium mb-2">Orecube Platform</h1>
      <h2 id="pageTitle" class="text-3xl font-semibold text-white">
        Welcome back
      </h2>
    </div>

    <!-- Auth Card -->
    <div class="bg-white rounded-2xl p-6 shadow-lg">
      
      <!-- Email -->
      <input
        id="email"
        type="email"
        placeholder="Email address"
        class="w-full mb-4 px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black"
        required
      />

      <!-- Password (hidden first) -->
      <input
        id="password"
        type="password"
        placeholder="Password"
        class="w-full mb-4 px-4 py-3 rounded-full border border-gray-300 focus:outline-none focus:ring-2 focus:ring-black hidden"
      />

      <!-- Continue -->
      <button
        id="continueBtn"
        class="w-full py-3 rounded-full bg-black text-white font-medium hover:bg-gray-900 transition"
      >
        Continue
      </button>

      <!-- Switch login/signup -->
      <p class="text-center text-sm text-gray-600 mt-4">
        <span id="switchText">Don’t have an account?</span>
        <button id="toggleMode" class="text-blue-600 hover:underline ml-1">
          Sign up
        </button>
      </p>

      <!-- Divider -->
      <div class="flex items-center my-6">
        <div class="flex-1 h-px bg-gray-200"></div>
        <span class="px-3 text-gray-400 text-xs">OR</span>
        <div class="flex-1 h-px bg-gray-200"></div>
      </div>

      <!-- OAuth -->
      <div class="space-y-3">
        <button id="googleSignIn"
          class="w-full flex items-center justify-center gap-3 py-3 rounded-full border border-gray-300 hover:bg-gray-100 transition">
          <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5">
          Continue with Google
        </button>

        <button id="githubSignIn"
          class="w-full flex items-center justify-center gap-3 py-3 rounded-full border border-gray-300 hover:bg-gray-100 transition">
          <img src="https://www.svgrepo.com/show/512317/github-142.svg" class="w-5 h-5">
          Continue with GitHub
        </button>
      </div>
    </div>

    <!-- Footer -->
    <div class="text-center text-xs text-gray-400 mt-6">
      <a href="#" class="hover:underline">Terms of Use</a>
      <span class="mx-2">|</span>
      <a href="#" class="hover:underline">Privacy Policy</a>
    </div>
  </div>

  <!-- Logic -->
  <script type="module">
    import { auth, googleProvider, githubProvider } from './firebase-config.js';
    import {
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      signInWithPopup
    } from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const continueBtn = document.getElementById('continueBtn');
    const toggleMode = document.getElementById('toggleMode');
    const pageTitle = document.getElementById('pageTitle');
    const switchText = document.getElementById('switchText');

    let isSignup = false;
    let step = 1;

    continueBtn.addEventListener('click', async () => {
      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email) return alert('Enter email');

      if (step === 1) {
        passwordInput.classList.remove('hidden');
        step = 2;
        continueBtn.textContent = isSignup ? 'Create account' : 'Sign in';
        return;
      }

      try {
        if (isSignup) {
          await createUserWithEmailAndPassword(auth, email, password);
        } else {
          await signInWithEmailAndPassword(auth, email, password);
        }
        window.location.href = '/';
      } catch (err) {
        alert(err.message);
      }
    });

    toggleMode.addEventListener('click', () => {
      isSignup = !isSignup;
      pageTitle.textContent = isSignup ? 'Create an account' : 'Welcome back';
      switchText.textContent = isSignup ? 'Already have an account?' : 'Don’t have an account?';
      toggleMode.textContent = isSignup ? 'Log in' : 'Sign up';
      continueBtn.textContent = 'Continue';
      passwordInput.classList.add('hidden');
      step = 1;
    });

    document.getElementById('googleSignIn').onclick = async () => {
      await signInWithPopup(auth, googleProvider);
      window.location.href = '/';
    };

    document.getElementById('githubSignIn').onclick = async () => {
      await signInWithPopup(auth, githubProvider);
      window.location.href = '/';
    };
  </script>
</body>
</html>
