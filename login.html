<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Orecube</title>

<script src="https://cdn.tailwindcss.com"></script>
<script type="module" src="/firebase-config.js"></script>

<style>
.input {
  width: 100%;
  padding: 14px 18px;
  border-radius: 9999px;
  border: 1px solid #d1d5db;
  background: transparent;
  outline: none;
}
.input:focus {
  border-color: black;
}
.label {
  font-size: 12px;
  color: #6b7280;
}
.error {
  color: #dc2626;
  font-size: 13px;
  margin-top: 6px;
}
</style>
</head>

<body class="bg-black text-white min-h-screen flex flex-col">

<main class="flex-1 max-w-md mx-auto w-full px-6 pt-24">

<p class="text-center text-sm font-medium mb-4">Orecube Platform</p>

<h1 id="title" class="text-center text-3xl font-semibold mb-10">
  Welcome back
</h1>

<!-- EMAIL STEP -->
<section id="emailStep">
  <label class="label">Email address</label>
  <input id="email" class="input mt-2" type="email">
  <p id="emailError" class="error hidden"></p>

  <button id="emailContinue"
    class="mt-8 w-full py-3 rounded-full bg-white text-black font-medium">
    Continue
  </button>
</section>

<!-- PASSWORD STEP -->
<section id="passwordStep" class="hidden">

  <p class="text-sm text-gray-400 mb-2">
    <span id="emailPreview"></span>
    <button id="editEmail" class="text-blue-400 ml-2">Edit</button>
  </p>

  <label class="label">Password</label>
  <input id="password" class="input mt-2" type="password">
  <p id="passwordError" class="error hidden"></p>

  <button id="passwordContinue"
    class="mt-8 w-full py-3 rounded-full bg-white text-black font-medium">
    Continue
  </button>

  <button id="forgotPassword"
    class="mt-4 text-sm text-blue-400">
    Forgot password?
  </button>
</section>

<!-- CODE STEP -->
<section id="codeStep" class="hidden">

  <p class="text-center text-gray-400 mb-4">
    Enter the verification code sent to<br>
    <span id="codeEmail"></span>
  </p>

  <label class="label">Code</label>
  <input id="code" class="input mt-2">
  <p id="codeError" class="error hidden"></p>

  <button id="codeContinue"
    class="mt-8 w-full py-3 rounded-full bg-white text-black font-medium">
    Continue
  </button>

  <button id="resendCode" class="mt-4 text-sm text-gray-400">
    Resend email
  </button>
</section>

<!-- OAUTH -->
<div class="mt-14 space-y-3">
  <button id="google" class="w-full py-3 rounded-full bg-white text-black">
    Continue with Google
  </button>
  <button id="microsoft" class="w-full py-3 rounded-full bg-white text-black">
    Continue with Microsoft
  </button>
  <button id="github" class="w-full py-3 rounded-full bg-white text-black">
    Continue with GitHub
  </button>
</div>

</main>

<footer class="text-center text-xs text-gray-500 pb-8">
  <a href="#">Terms of Use</a> | <a href="#">Privacy Policy</a>
</footer>

<!-- AUTH LOGIC -->
<script type="module">
import { auth } from './firebase-config.js';
import {
  signInWithEmailAndPassword,
  sendPasswordResetEmail,
  signInWithPopup,
  GoogleAuthProvider,
  GithubAuthProvider,
  OAuthProvider
} from "https://www.gstatic.com/firebasejs/10.13.1/firebase-auth.js";

const googleProvider = new GoogleAuthProvider();
const githubProvider = new GithubAuthProvider();
const microsoftProvider = new OAuthProvider('microsoft.com');

const emailStep = document.getElementById('emailStep');
const passwordStep = document.getElementById('passwordStep');
const codeStep = document.getElementById('codeStep');

const emailInput = document.getElementById('email');
const passwordInput = document.getElementById('password');

document.getElementById('emailContinue').onclick = () => {
  if (!emailInput.value) {
    showError('emailError', 'Email is required');
    return;
  }
  emailStep.classList.add('hidden');
  passwordStep.classList.remove('hidden');
  document.getElementById('emailPreview').textContent = emailInput.value;
};

document.getElementById('editEmail').onclick = () => {
  passwordStep.classList.add('hidden');
  emailStep.classList.remove('hidden');
};

document.getElementById('passwordContinue').onclick = async () => {
  try {
    await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
    window.location.href = '/';
  } catch {
    showError('passwordError', 'Incorrect email address or password');
  }
};

document.getElementById('forgotPassword').onclick = async () => {
  await sendPasswordResetEmail(auth, emailInput.value);
  alert('Password reset email sent');
};

document.getElementById('google').onclick = () =>
  signInWithPopup(auth, googleProvider).then(() => location.href = '/');

document.getElementById('github').onclick = () =>
  signInWithPopup(auth, githubProvider).then(() => location.href = '/');

document.getElementById('microsoft').onclick = () =>
  signInWithPopup(auth, microsoftProvider).then(() => location.href = '/');

function showError(id, msg) {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.remove('hidden');
}
</script>

</body>
</html>
