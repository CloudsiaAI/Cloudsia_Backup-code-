<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Orecube Auth</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      font-family: Inter, sans-serif;
    }

    body {
      margin: 0;
      background: #fff;
      color: #000;
    }

    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 32px 16px 24px;
    }

    .logo {
      font-weight: 600;
      margin-bottom: 32px;
    }

    h1 {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 12px;
      text-align: center;
    }

    p.sub {
      color: #555;
      text-align: center;
      margin-bottom: 24px;
      font-size: 14px;
    }

    .form {
      width: 100%;
      max-width: 380px;
    }

    /* Floating label input */
    .field {
      position: relative;
      margin-bottom: 18px;
    }

    .field input {
      width: 100%;
      padding: 18px 16px;
      border-radius: 999px;
      border: 1px solid #ddd;
      font-size: 15px;
      background: transparent;
      outline: none;
    }

    .field label {
      position: absolute;
      top: -8px;
      left: 18px;
      font-size: 12px;
      background: #fff;
      padding: 0 6px;
      color: #777;
    }

    .error {
      color: #d00;
      font-size: 13px;
      margin-top: 6px;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border-radius: 999px;
      border: none;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-primary {
      background: #000;
      color: #fff;
      margin-top: 8px;
    }

    .btn-outline {
      background: transparent;
      border: 1px solid #ddd;
      margin-top: 10px;
    }

    .link {
      color: #0066ff;
      font-size: 14px;
      text-align: center;
      margin-top: 16px;
      cursor: pointer;
    }

    .or {
      text-align: center;
      margin: 20px 0;
      color: #777;
      font-size: 13px;
    }

    .socials button {
      width: 100%;
      padding: 14px;
      border-radius: 999px;
      border: 1px solid #ddd;
      background: #fff;
      margin-bottom: 10px;
      cursor: pointer;
    }

    footer {
      margin-top: auto;
      font-size: 13px;
      color: #777;
      padding-top: 24px;
    }

    footer a {
      color: #555;
      text-decoration: none;
      margin: 0 6px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>
  <div class="page">
    <div class="logo">Orecube Platform</div>

    <!-- STEP 1: EMAIL -->
    <div id="step-email" class="form">
      <h1>Sign in</h1>

      <div class="field">
        <label>Email address</label>
        <input id="email" type="email" />
        <div id="emailError" class="error hidden">Email is required</div>
      </div>

      <button class="btn btn-primary" onclick="goPassword()">Continue</button>

      <div class="or">OR</div>

      <div class="socials">
        <button onclick="loginGoogle()">Continue with Google</button>
        <button onclick="loginGithub()">Continue with GitHub</button>
        <button onclick="loginMicrosoft()">Continue with Microsoft</button>
      </div>
    </div>

    <!-- STEP 2: PASSWORD -->
    <div id="step-password" class="form hidden">
      <h1>Enter your password</h1>
      <p class="sub" id="showEmail"></p>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password"/>
        <div id="passwordError" class="error hidden">Incorrect password</div>
      </div>

      <div class="link" onclick="forgotPassword()">Forgot password?</div>

      <button class="btn btn-primary" onclick="goVerify()">Continue</button>
    </div>

    <!-- STEP 3: VERIFICATION -->
    <div id="step-code" class="form hidden">
      <h1>Check your inbox</h1>
      <p class="sub">Enter the verification code we sent</p>

      <div class="field">
        <label>Code</label>
        <input id="code" type="text"/>
        <div id="codeError" class="error hidden">Invalid verification code</div>
      </div>

      <button class="btn btn-primary" onclick="verifyCode()">Continue</button>

      <div class="link" onclick="resendCode()">Resend email</div>
    </div>

    <footer>
      <a href="#">Terms of Use</a> |
      <a href="#">Privacy Policy</a>
    </footer>
  </div>

  <script>
    const emailInput = document.getElementById("email");

    function goPassword() {
      if (!emailInput.value) {
        document.getElementById("emailError").classList.remove("hidden");
        return;
      }
      document.getElementById("emailError").classList.add("hidden");
      document.getElementById("step-email").classList.add("hidden");
      document.getElementById("step-password").classList.remove("hidden");
      document.getElementById("showEmail").innerText = emailInput.value;
    }

    function goVerify() {
      const pass = document.getElementById("password").value;
      if (pass !== "123456") {
        document.getElementById("passwordError").classList.remove("hidden");
        return;
      }
      document.getElementById("passwordError").classList.add("hidden");
      document.getElementById("step-password").classList.add("hidden");
      document.getElementById("step-code").classList.remove("hidden");
    }

    function verifyCode() {
      const code = document.getElementById("code").value;
      if (code !== "000000") {
        document.getElementById("codeError").classList.remove("hidden");
        return;
      }
      alert("Login successful");
    }

    function forgotPassword() {
      alert("Password reset flow here");
    }

    function resendCode() {
      alert("Verification code resent");
    }

    function loginGoogle() {
      alert("Google OAuth");
    }

    function loginGithub() {
      alert("GitHub OAuth");
    }

    function loginMicrosoft() {
      alert("Microsoft OAuth");
    }
  </script>
</body>
  </html>
